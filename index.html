<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf3e8">
  <meta name="description" content="Stir marbled gel, fill a mold, peel out a squishy, and play with the jelly you made.">
  <title>Squishy Factory</title>
  <link rel="icon" href="assets/gel/drop.svg" type="image/svg+xml">
  <link rel="preload" href="assets/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/gel/stir.webp" as="image" fetchpriority="high">
  <link rel="stylesheet" href="studio.css?v=dc74d4948">
  <script defer src="audio-v2.js?v=e6473e7ee"></script><script defer src="make-v2.js?v=2412b03a6"></script>
  <script defer src="play-v2.js?v=f206d34b6"></script><script defer src="studio.js?v=6103a8149"></script>
</head>
<body>
<header class="mast">
  <div class="brand"><img width="44" height="44" src="assets/gel/drop.svg" alt=""><span>Squishy Factory</span></div>
  <button id="sound" class="sound" aria-label="Mute sound" aria-pressed="true"><span class="sound-symbol"></span><span id="sound-label">Sound on</span></button>
</header>
<main>
  <div class="heading">
    <h1 id="title">Stir the gel</h1>
    <div id="steps" class="steps" aria-label="Making progress"><span>Mix</span><i></i><span>Fill</span><i></i><span>Peel</span><i></i><span>Play</span></div>
  </div>
  <section id="console" aria-label="Your squishy work surface">
    <div id="scene" class="scene" data-stage="stir">
      <div class="batch-tag" aria-hidden="true"><b></b><span id="flavor">Strawberry swirl</span></div>
      <canvas class="surface" id="make-surface" role="button" aria-label="Stir the gel with your finger" tabindex="0"></canvas>
      <canvas class="surface" id="play-surface" role="button" aria-label="Play with your squishy" tabindex="0" hidden></canvas>
      <div id="demonstration" class="demonstration" aria-hidden="true">
        <svg class="route" viewBox="0 0 120 100"><path id="route-path" d="M86 61c7-17-9-30-34-28S17 53 22 65s25 16 41 9"/></svg>
        <svg class="finger" viewBox="0 0 50 54"><path d="M16 27V11c0-6 8-6 8 0v13-4c0-5 7-5 7 0v4-2c0-5 7-5 7 0v3c1-4 7-3 7 1v9c0 9-6 15-14 15-5 0-8-2-11-5L8 32c-4-5 1-10 6-6l2 1z"/></svg>
      </div>
      <div id="load" role="status" hidden>Warming up…</div>
    </div>
    <div id="action-strip" class="action-strip">
      <div id="cue" class="cue">
        <div id="cue-icon" class="cue-icon" aria-hidden="true"></div>
        <div><p id="instruction">Draw circles in the bowl</p><div class="fill-track" id="fill-track" role="progressbar" aria-label="Stirring" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"><i id="fill"></i></div></div>
      </div>
      <div id="tools" class="tools" aria-label="Play tools" role="group" hidden></div>
      <div id="replay" class="replay" hidden>
        <button id="reform" hidden aria-label="Melt the pieces back together"></button>
        <button id="again" aria-label="Make another squishy"></button>
      </div>
    </div>
  </section>
  <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
</main>
<noscript>Turn on JavaScript to play Squishy Factory.</noscript>
</body></html>
